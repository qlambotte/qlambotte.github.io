<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light dark">
<title>Pilotage Prépa</title>
<script src="../pilotage/js/theme.js"></script>
<link rel="stylesheet" href="../pilotage/pilotage.css">
<link rel="stylesheet" href="board.css">
</head>
<body>
<div class="vue">
  <header class="band">
    <div class="b-outils">
      <p class="marque">Pilotage Prépa</p>
      <nav class="outils" aria-label="Outils">
        <a class="ico" href="index.html"><span class="rond"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4zM10 20v-6h4v6"/></svg></span><span class="il">Accueil</span></a>
        <a class="ico" href="unif.html"><span class="rond"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2.5"/><path d="M4 10h16M9 3v4M15 3v4"/></svg></span><span class="il">UMONS</span></a>
        <a class="ico" id="lien-site" href="https://qlambotte.github.io/coursPrepa/" target="_blank" rel="noopener" title="Ouvrir le site des cours préparatoires"><span class="rond"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5zM5 19.5A1.5 1.5 0 0 0 6.5 21H19"/></svg></span><span class="il">Site</span></a>
        <button class="ico" id="apparence" type="button" title="Jour, soir ou automatique"><span class="rond"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4v16"/></svg></span><span class="il">Jour</span></button>
      </nav>
    </div>
    <div class="b-classe">
      <p class="date">FMPB · cours préparatoires</p>
      <h1 class="titre">Solutions et ticket de sortie</h1>
      <p class="puces" id="puces"></p>
    </div>
    <div class="b-droite">
      <div class="b-etat"><button type="button" class="pastille sync" id="cx-etat" title="Recharger etat.json">Connexion…</button></div>
    </div>
  </header>
  <div class="annonces"><div id="avis" class="alerte" role="status" hidden></div></div>

  <main class="grille pr">
    <section class="carte" aria-labelledby="s1">
      <div class="ent"><span class="badge b-cu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5zM5 19.5A1.5 1.5 0 0 0 6.5 21H19"/></svg></span><div><h2 id="s1">Séance</h2><div class="doux" id="s-sub">Choisis le thème de la séance</div></div></div>
      <div class="chips" id="themes" role="group" aria-label="Thème"></div>
      <div class="bloc-p" id="seance"></div>
    </section>

    <div class="colonne-p">
      <section class="carte" aria-labelledby="r1">
        <div class="ent"><span class="badge b-ol"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM9.5 9.5a2.5 2.5 0 1 1 3.6 2.2c-.8.4-1.1.9-1.1 1.8M12 17h.01"/></svg></span><div><h2 id="r1">Réponses masquées</h2><div class="doux">Questions de la séance de questions-réponses</div></div></div>
        <input id="filtre" type="text" placeholder="Chercher (identifiant ou énoncé)…" aria-label="Chercher une question masquée" autocomplete="off">
        <div class="bloc-p" id="masquees"></div>
      </section>
      <section class="carte" aria-labelledby="c1">
        <div class="ent"><span class="badge b-a"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="15" r="3.5"/><path d="M10.5 12.5L20 3M16 7l3 3"/></svg></span><div><h2 id="c1">Connexion</h2><div class="doux" id="cx-sub"></div></div></div>
        <div class="bloc-p" id="cx"></div>
      </section>
    </div>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="../pilotage/js/outils.js"></script>
<script src="../pilotage/js/horaire.js"></script>
<script src="js/ics.js"></script>
<script src="js/depot.js"></script>
<script src="js/taches.js"></script>
<script src="js/board.js"></script>
<script src="js/prepa-logique.js"></script>
<script src="js/prepa.js"></script>
</body>
</html>
